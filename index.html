<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SWU AI Chat Test</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-box {
      width: 400px;
      background: #1e293b;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      background: #0b1220;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .msg {
      margin: 5px 0;
    }

    .user { color: #38bdf8; }
    .bot { color: #a3e635; }

    input {
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
      flex: 1;
    }

    button {
      padding: 10px;
      margin-left: 5px;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .input-row {
      display: flex;
    }
  </style>
</head>
<body>

<div class="chat-box">
  <div id="messages"></div>

  <div class="input-row">
    <input id="input" placeholder="พิมพ์ข้อความ..." />
    <button onclick="send()">ส่ง</button>
  </div>
</div>

<script>
const API_URL = "http://localhost:3000/chat";

const messagesEl = document.getElementById("messages");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = (type === "user" ? "You: " : "AI: ") + text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  addMessage(data.reply || "no response", "bot");
}
</script>

</body>
</html>
