<!DOCTYPE html>
<html lang="th">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>SWU AI Gateway</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{

      margin:0;

      font-family:
        Inter,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #020617,
          #0f172a,
          #111827
        );

      min-height:100vh;

      color:white;

      padding:32px;
    }

    .container{

      max-width:1000px;

      margin:auto;
    }

    .header{

      margin-bottom:28px;
    }

    .title{

      font-size:42px;

      font-weight:800;

      margin-bottom:10px;
    }

    .subtitle{

      color:#cbd5e1;

      line-height:1.7;
    }

    .card{

      background:
        rgba(255,255,255,0.05);

      border:
        1px solid rgba(255,255,255,0.08);

      border-radius:28px;

      padding:26px;

      backdrop-filter:blur(16px);

      margin-bottom:24px;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.4);
    }

    .section-title{

      font-size:22px;

      font-weight:700;

      margin-bottom:18px;
    }

    label{

      display:block;

      margin-bottom:10px;

      color:#e2e8f0;

      font-size:15px;
    }

    textarea,
    select{

      width:100%;

      border:none;

      outline:none;

      border-radius:18px;

      padding:16px;

      font-size:16px;

      background:#0f172a;

      color:white;

      border:
        1px solid rgba(255,255,255,0.08);

      margin-bottom:18px;
    }

    textarea{

      min-height:130px;

      resize:vertical;
    }

    textarea:focus,
    select:focus{

      border-color:#22c55e;

      box-shadow:
        0 0 0 4px rgba(34,197,94,0.15);
    }

    .row{

      display:flex;

      gap:14px;

      align-items:center;

      flex-wrap:wrap;
    }

    .upload-box{

      background:#0f172a;

      border:
        2px dashed rgba(255,255,255,0.1);

      border-radius:20px;

      padding:20px;

      margin-bottom:18px;
    }

    input[type="file"]{

      color:#cbd5e1;

      width:100%;
    }

    button{

      border:none;

      border-radius:18px;

      padding:15px 24px;

      font-size:16px;

      font-weight:700;

      cursor:pointer;

      color:white;

      transition:0.2s;
    }

    .send-btn{

      background:
        linear-gradient(
          135deg,
          #22c55e,
          #06b6d4
        );
    }

    .gen-btn{

      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #ec4899
        );
    }

    button:hover{

      transform:
        translateY(-2px);

      opacity:0.95;
    }

    button:disabled{

      opacity:0.5;

      cursor:not-allowed;

      transform:none;
    }

    .checkbox{

      display:flex;

      align-items:center;

      gap:10px;

      margin-bottom:18px;

      color:#cbd5e1;
    }

    .preview{

      width:100%;

      max-width:400px;

      border-radius:20px;

      margin-top:18px;

      border:
        1px solid rgba(255,255,255,0.08);
    }

    .response{

      background:#020617;

      border-radius:20px;

      padding:22px;

      min-height:120px;

      white-space:pre-wrap;

      overflow:auto;

      line-height:1.8;

      border:
        1px solid rgba(255,255,255,0.08);

      color:#f8fafc;
    }

    .loading{

      color:#67e8f9;

      margin-top:10px;
    }

    .generated-image{

      max-width:100%;

      border-radius:20px;

      margin-top:18px;

      border:
        1px solid rgba(255,255,255,0.08);
    }

    @media(max-width:700px){

      body{
        padding:18px;
      }

      .title{
        font-size:32px;
      }

      .card{
        padding:20px;
      }
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="header">

      <div class="title">
        SWU AI Gateway
      </div>

      <div class="subtitle">
        Multi Model AI Gateway สำหรับ Chat,
        Vision และ Image Generation
      </div>

    </div>

    <!-- CHAT -->

    <div class="card">

      <div class="section-title">
        Text / Vision Chat
      </div>

      <label>
        Select Model
      </label>

      <select id="model"></select>

      <div class="checkbox">

        <input
          type="checkbox"
          id="stream"
        >

        <span>
          Enable Streaming
        </span>

      </div>

      <label>
        Prompt
      </label>

      <textarea
        id="message"
        placeholder="Type your message..."
      ></textarea>

      <div class="upload-box">

        <label>
          Upload Image
        </label>

        <input
          type="file"
          id="image"
          accept="image/*"
        >

      </div>

      <button
        class="send-btn"
        id="send"
      >
        Send Request
      </button>

      <img
        id="preview"
        class="preview"
        src=""
      >

    </div>

    <!-- IMAGE GENERATION -->

    <div class="card">

      <div class="section-title">
        Image Generation
      </div>

      <textarea
        id="gen_prompt"
        placeholder="Describe the image..."
      ></textarea>

      <button
        class="gen-btn"
        id="gen"
      >
        Generate Image
      </button>

      <div
        id="gen_result"
        style="margin-top:20px"
      ></div>

    </div>

    <!-- RESPONSE -->

    <div class="card">

      <div class="section-title">
        Response
      </div>

      <div
        id="response"
        class="response"
      >
        Waiting for response...
      </div>

    </div>

  </div>

  <script>

    /*
      =========================
      PUT YOUR CLOUD RUN URL
      =========================
    */

    const API_BASE =
      "https://swu-api-267418408907.asia-southeast1.run.app";

    const MODELS = [

      "google/gemini-2.5-flash",
      "google/gemini-3-flash-preview",
      "google/gemini-3.1-pro-preview",
      "google/gemini-2.5-flash-image",
      "google/gemini-3-pro-image-preview",

      "openai/gpt-5",
      "openai/gpt-5.2",
      "openai/gpt-5.4-mini",
      "openai/gpt-5.4-nano",

      "anthropic/claude-sonnet-4.6",
      "anthropic/claude-opus-4.6",

      "deepseek-v4-flash",
      "deepseek-v4-pro",

      "x-ai/grok-4.1-fast",

      "qwen/qwen3-max-thinking"
    ];

    const modelSel =
      document.getElementById(
        "model"
      );

    MODELS.forEach(m=>{

      const option =
        document.createElement(
          "option"
        );

      option.value = m;

      option.textContent = m;

      modelSel.appendChild(
        option
      );
    });

    const imgInput =
      document.getElementById(
        "image"
      );

    imgInput.addEventListener(
      "change",
      ()=>{

        const file =
          imgInput.files[0];

        const preview =
          document.getElementById(
            "preview"
          );

        if(!file){

          preview.src = "";

          return;
        }

        preview.src =
          URL.createObjectURL(
            file
          );
      }
    );

    /*
      =========================
      CHAT
      =========================
    */

    document
      .getElementById("send")
      .addEventListener(
        "click",
        async ()=>{

          const out =
            document.getElementById(
              "response"
            );

          out.textContent =
            "Loading...";

          const message =
            document.getElementById(
              "message"
            ).value;

          const file =
            imgInput.files[0];

          const model =
            modelSel.value;

          const stream =
            document.getElementById(
              "stream"
            ).checked;

          const form =
            new FormData();

          form.append(
            "message",
            message
          );

          form.append(
            "model",
            model
          );

          if(file){

            form.append(
              "image",
              file
            );
          }

          try{

            if(stream){

              const res =
                await fetch(
                  `${API_BASE}/chat?stream=true`,
                  {
                    method:"POST",
                    body:form
                  }
                );

              if(!res.ok){

                out.textContent =
                  `Error ${res.status}`;

                return;
              }

              out.textContent = "";

              const reader =
                res.body.getReader();

              const decoder =
                new TextDecoder();

              let buffer = "";

              while(true){

                const {
                  value,
                  done
                } =
                  await reader.read();

                if(done)
                  break;

                buffer +=
                  decoder.decode(
                    value,
                    {
                      stream:true
                    }
                  );

                const parts =
                  buffer.split(
                    "\n\n"
                  );

                buffer =
                  parts.pop();

                for(const part of parts){

                  const lines =
                    part.split("\n");

                  for(const line of lines){

                    if(
                      line.startsWith(
                        "data: "
                      )
                    ){

                      out.textContent +=
                        line
                          .slice(6)
                          .replace(
                            /\\n/g,
                            "\n"
                          );
                    }
                  }
                }
              }

            }else{

              const res =
                await fetch(
                  `${API_BASE}/chat`,
                  {
                    method:"POST",
                    body:form
                  }
                );

              const text =
                await res.text();

              try{

                const data =
                  JSON.parse(
                    text
                  );

                out.textContent =
                  data.reply ||
                  data.message ||
                  data.text ||
                  data.response ||
                  JSON.stringify(
                    data,
                    null,
                    2
                  );

              }catch{

                out.textContent =
                  text;
              }
            }

          }catch(err){

            out.textContent =
              "Error: " +
              err.message;
          }
        }
      );

    /*
      =========================
      IMAGE GENERATION
      =========================
    */

    document
      .getElementById("gen")
      .addEventListener(
        "click",
        async ()=>{

          const result =
            document.getElementById(
              "gen_result"
            );

          result.innerHTML =
            "Generating image...";

          const prompt =
            document.getElementById(
              "gen_prompt"
            ).value;

          const model =
            modelSel.value;

          try{

            const res =
              await fetch(
                `${API_BASE}/generate-image`,
                {
                  method:"POST",

                  headers:{
                    "Content-Type":
                      "application/json"
                  },

                  body:JSON.stringify({

                    prompt,
                    model
                  })
                }
              );

            const data =
              await res.json();

            if(data.image){

              result.innerHTML = "";

              const img =
                document.createElement(
                  "img"
                );

              img.src =
                data.image;

              img.className =
                "generated-image";

              result.appendChild(
                img
              );

            }else{

              result.textContent =
                JSON.stringify(
                  data,
                  null,
                  2
                );
            }

          }catch(err){

            result.textContent =
              "Error: " +
              err.message;
          }
        }
      );

  </script>

</body>
</html>
